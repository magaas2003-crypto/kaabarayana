<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eye of Creation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
  /* One full-bleed live canvas. Chrome (wordmark, controls, scene index) sits on top and fades away when idle. */
  :root {
    --ink: #07060a;
    --paper: #efe6d8;
    --dim: #8f8678;
    --amber: #d9893a;
    --veil: rgba(7, 6, 10, .55);
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper);
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em;
    overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none;
  }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); cursor: crosshair; }

  body.idle canvas#view { cursor: none; }


  /* ═════════ the story after the animation: eyes + button, then the letter ═════════ */
  :root {
    --gold: #f0d9a8; --gold-d: #c9a25f;
    --serif: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
    --hand: "Caveat", "Marck Script", "Segoe Script", "Bradley Hand", cursive;
    --EW: min(86vw, 560px, 92vh);
    --EH: calc(var(--EW) * .66);
    --LW: calc(var(--EW) * .9);
    --LH: calc(var(--LW) * 1.414);
    --PH: calc(var(--LH) / 3);
  }
  body { touch-action: manipulation; }
  canvas#view { transform-origin: 50% 50%; will-change: transform; }
  body.s-eyes canvas#view { transform: scale(1.07); transition: transform 14s cubic-bezier(.2, .6, .2, 1); }
  body.s-leaving canvas#view { transform: scale(1.22); transition: transform 2.4s cubic-bezier(.5, 0, .9, .6); }

  /* a quiet shade under the button so it reads on top of the eye */
  .eyes-shade {
    position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 70% at 50% 100%, rgba(8, 5, 4, .78), rgba(8, 5, 4, 0) 62%),
                radial-gradient(90% 90% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55));
    transition: opacity 3.2s ease;
  }
  body.s-eyes .eyes-shade { opacity: 1; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }

  /* ── the button ── */
  .cta-wrap {
    position: fixed; left: 50%; bottom: max(11vh, 70px); z-index: 5; transform: translateX(-50%);
    display: grid; place-items: center; pointer-events: none;
  }
  .cta-bloom {
    position: absolute; left: 50%; top: 50%; width: 150%; aspect-ratio: 2.4; transform: translate(-50%, -50%) scale(.4);
    background: radial-gradient(closest-side, rgba(255, 224, 160, .55), rgba(255, 200, 120, .16) 55%, rgba(255, 200, 120, 0));
    filter: blur(14px); opacity: 0; pointer-events: none;
  }
  .cta-wrap.on .cta-bloom { animation: bloomBirth 2.6s cubic-bezier(.2, .7, .2, 1) forwards, bloomBreath 5.5s ease-in-out 2.6s infinite; }
  @keyframes bloomBirth { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 45% { opacity: .95; } 100% { opacity: .55; transform: translate(-50%, -50%) scale(1); } }
  @keyframes bloomBreath { 0%, 100% { opacity: .5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: .8; transform: translate(-50%, -50%) scale(1.07); } }

  .cta {
    position: relative; pointer-events: none; cursor: pointer; border: 0; background: none; padding: 0; margin: 0;
    color: var(--gold); font-family: var(--serif); font-style: italic; font-weight: 500; letter-spacing: .06em; text-transform: none;
    font-size: clamp(19px, 2.3vw, 25px); -webkit-tap-highlight-color: transparent;
    transition: transform .6s cubic-bezier(.2, .7, .2, 1);
  }
  .cta-wrap.live .cta { pointer-events: auto; }
  .cta-body { position: relative; display: block; padding: .95em 2.5em .98em; border-radius: 999px; white-space: nowrap; }
  .cta-bg {
    position: absolute; inset: 0; border-radius: 999px; --hl: 0;
    background: radial-gradient(120% 160% at var(--mx, 50%) var(--my, 0%), rgba(255, 228, 170, var(--hl)), rgba(255, 228, 170, 0) 60%),
                linear-gradient(180deg, rgba(40, 26, 18, .46), rgba(18, 11, 8, .62));
    -webkit-backdrop-filter: blur(9px) saturate(1.2); backdrop-filter: blur(9px) saturate(1.2);
    opacity: 0; transition: opacity 1.6s ease, box-shadow .7s ease, --hl .7s ease;
    box-shadow: 0 0 0 rgba(255, 210, 140, 0), 0 10px 40px rgba(0, 0, 0, .35);
  }
  .cta-wrap.filled .cta-bg { opacity: 1; }
  .cta svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .cta svg.ring rect { fill: none; vector-effect: non-scaling-stroke; width: calc(100% - 2px); height: calc(100% - 2px); x: 1px; y: 1px; rx: 999px; }
  .ring .base { stroke: url(#goldline); stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 5px rgba(255, 214, 150, .75)); }
  .ring .inner { stroke: rgba(255, 226, 170, .3); stroke-width: .8; stroke-dasharray: 1; stroke-dashoffset: 1; x: 5px; y: 5px; width: calc(100% - 10px); height: calc(100% - 10px); }
  .cta-wrap.drawing .ring .base { transition: stroke-dashoffset 2.1s cubic-bezier(.45, .1, .2, 1); stroke-dashoffset: 0; }
  .cta-wrap.drawing .ring .inner { transition: stroke-dashoffset 2.6s cubic-bezier(.45, .1, .2, 1) .5s; stroke-dashoffset: 0; }
  .cta .lbl { position: relative; display: inline-block; text-shadow: 0 0 18px rgba(255, 210, 140, .55); }
  .cta .lbl i { display: inline-block; font-style: inherit; opacity: 0; filter: blur(8px); transform: translateY(6px); }
  .cta-wrap.texted .lbl i { opacity: 1; filter: blur(0); transform: none; transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--n) * 62ms); }
  .cta .orn { position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; background: var(--gold); transform: rotate(45deg) scale(0); box-shadow: 0 0 10px rgba(255, 220, 160, .9); }
  .cta .orn.l { left: 1.05em; } .cta .orn.r { right: 1.05em; }
  .cta-wrap.texted .orn { transform: rotate(45deg) scale(1); transition: transform 1.2s cubic-bezier(.2, .9, .2, 1) 1s; }
  .cta:hover .cta-bg, .cta:focus-visible .cta-bg { box-shadow: 0 0 34px rgba(255, 200, 130, .35), 0 10px 40px rgba(0, 0, 0, .4); --hl: .26; }
  .cta:hover { transform: translateY(-2px) scale(1.018); }
  .cta:hover .ring .base { filter: drop-shadow(0 0 9px rgba(255, 224, 170, 1)); }
  .cta:focus-visible { outline: none; }
  .cta:focus-visible .cta-body { outline: 1px solid var(--gold); outline-offset: 5px; border-radius: 999px; }
  .cta-wrap.leaving .cta { transform: scale(1.06); opacity: 0; transition: transform 1s ease, opacity 1s ease; pointer-events: none; }
  @property --hl { syntax: "<number>"; inherits: true; initial-value: 0; }
  @media (max-width: 520px) { .cta-wrap { bottom: max(11vh, 70px); } .cta-body { padding: .9em 1.9em .95em; } }

  /* ── transition + the letter scene ── */
  .veil { position: fixed; inset: 0; z-index: 6; background: #0b0706; opacity: 0; pointer-events: none; transition: opacity 1.9s cubic-bezier(.5, 0, .6, 1); }
  body.s-leaving .veil { opacity: 1; transition-delay: .35s; }
  .scene-letter {
    position: fixed; inset: 0; z-index: 7; display: none; opacity: 0; overflow: hidden; touch-action: manipulation;
    background: radial-gradient(75% 65% at 50% 46%, #4a3220 0%, #2a1b11 48%, #120b07 100%);
    transition: opacity 1.6s ease;
  }
  body.s-letter .scene-letter { display: block; }
  body.s-letter-in .scene-letter { opacity: 1; }
  .scene-letter::before { content: ""; position: absolute; inset: 0; background: var(--grain); opacity: .22; mix-blend-mode: overlay; pointer-events: none; }
  .scene-letter::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 100% at 50% 50%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, .55)); }
  .warm { position: absolute; left: 50%; top: 46%; width: 90vmin; height: 90vmin; transform: translate(-50%, -50%); pointer-events: none;
          background: radial-gradient(closest-side, rgba(255, 190, 110, .20), rgba(255, 170, 90, 0)); animation: candle 6s ease-in-out infinite; }
  @keyframes candle { 0%, 100% { opacity: .85; } 40% { opacity: 1; } 70% { opacity: .78; } }

  .stage {
    position: absolute; left: 50%; top: 50%; width: var(--EW); height: var(--EH);
    margin-left: calc(var(--EW) / -2); margin-top: calc(var(--EH) / -2);
    transform: translateY(var(--ty, 0px)) scale(var(--k, 1)); transform-origin: 50% 50%;
    transition: transform 2.4s cubic-bezier(.45, .05, .2, 1);
    opacity: 0; z-index: 1;
  }
  body.s-letter-in .stage { animation: arrive 2s cubic-bezier(.2, .8, .2, 1) .5s both; }
  @keyframes arrive { 0% { opacity: 0; translate: 0 -34px; rotate: -2.5deg; } 100% { opacity: 1; translate: 0 0; rotate: 0deg; } }
  .stage > * { position: absolute; }
  .env-back, .env-front { left: 0; top: 0; width: 100%; height: 100%; transition: opacity 1s ease, transform 1s ease; }
  .env-back { z-index: 1; border-radius: 3px;
    background: var(--grain), var(--fibres), linear-gradient(180deg, #8d6339, #a37548);
    box-shadow: 0 30px 60px rgba(0, 0, 0, .55), 0 6px 14px rgba(0, 0, 0, .4); }
  .env-front { z-index: 3; border-radius: 3px; overflow: hidden;
    background: var(--grain), var(--fibres), linear-gradient(170deg, #cfa273, #bb8b5c 55%, #b0804f); }
  .env-front svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flapwrap { z-index: 4; left: 0; top: 0; width: 100%; height: calc(var(--EH) * .56); perspective: 1400px; transition: opacity 1s ease, transform 1s ease; }
  .flap { position: absolute; inset: 0; transform-origin: 50% 0; transform-style: preserve-3d; transition: transform 1.25s cubic-bezier(.5, .05, .25, 1); }
  .flap .f, .flap .b { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flap .f { background: var(--grain), var(--fibres), linear-gradient(185deg, #d3a678, #bf8f60); }
  .flap .b { transform: rotateY(180deg); background: var(--grain), linear-gradient(0deg, #5c3d22, #7b5530 70%, #6b4727); }
  .stage.flap-open .flap { transform: rotateX(-180deg); }
  .stage.flap-open .flapwrap { z-index: 0; transition: z-index 0s .62s, opacity 1s ease, transform 1s ease; }

  .letter { z-index: 2; left: calc((var(--EW) - var(--LW)) / 2); top: calc(var(--EH) * .92 - var(--PH)); width: var(--LW); height: var(--PH);
            perspective: 2200px; transition: transform 1.5s cubic-bezier(.35, .1, .2, 1); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .38)); }
  .stage.rise .letter { transform: translateY(calc(var(--EW) * -.5)); }
  .stage.gone .env-back, .stage.gone .env-front { opacity: 0; transform: translateY(26px); }
  .stage.gone .flapwrap { opacity: 0; }
  .pa, .pb, .pc { position: absolute; width: var(--LW); height: var(--PH); transform-style: preserve-3d;
    background: var(--grain), var(--fibres), linear-gradient(180deg, #e9d6ae, #e2cd9f);
    background-size: 340px 340px, 700px 220px, 100% calc(var(--PH) * 3); }
  .pa { left: 0; top: 0; background-position: 0 0, 0 0, 0 0; }
  .pb { left: 0; top: 100%; transform-origin: 50% 0; transform: translateZ(-1px) rotateX(-180deg); background-position: 0 calc(var(--PH) * -1), 0 calc(var(--PH) * -1), 0 calc(var(--PH) * -1);
        transition: transform 1.4s cubic-bezier(.45, .05, .2, 1); }
  .pc { left: 0; top: 100%; transform-origin: 50% 0; transform: translateZ(1px) rotateX(180deg); background-position: 0 calc(var(--PH) * -2), 0 calc(var(--PH) * -2), 0 calc(var(--PH) * -2);
        transition: transform 1.4s cubic-bezier(.45, .05, .2, 1); }
  .stage.u1 .pb { transform: translateZ(0) rotateX(0deg); }
  .stage.u2 .pc { transform: translateZ(0) rotateX(0deg); }
  .pb::before, .pc::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 9%; background: linear-gradient(rgba(70, 42, 18, .30), rgba(70, 42, 18, 0)); pointer-events: none; }
  .pa::after, .pb::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7%; background: linear-gradient(rgba(255, 250, 235, 0), rgba(255, 250, 235, .35)); pointer-events: none; }
  .pa::before { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 28px rgba(110, 70, 30, .28); pointer-events: none; }

  .text {
    position: absolute; left: 0; top: 0; width: var(--LW); height: var(--LH); transform: translateZ(2px); pointer-events: none;
    padding: 11% 11.5% 9%; color: #3a2616; font-family: var(--hand); font-weight: 500; font-size: calc(var(--LW) * .078); line-height: 1.32;
    text-align: left; overflow: hidden; -webkit-user-select: text; user-select: text;
  }
  .text p { margin: 0 0 .62em; }
  .text p.hi { font-size: 1.18em; margin-bottom: .5em; }
  .text .w { opacity: 0; filter: blur(7px); display: inline-block; transition: opacity 1.1s ease, filter 1.1s ease; transition-delay: calc(var(--i) * 85ms); white-space: pre; }
  .stage.read .text .w { opacity: 1; filter: blur(0); }
  .stage.read .text { pointer-events: auto; }

  /* ── wax seal ── */
  .seal { z-index: 6; left: 50%; top: calc(var(--EH) * .56); width: calc(var(--EW) * .2); aspect-ratio: 1; margin: calc(var(--EW) * -.1) 0 0 calc(var(--EW) * -.1);
          border: 0; padding: 0; background: none; cursor: pointer; filter: drop-shadow(0 6px 5px rgba(30, 6, 4, .55)); transition: transform .5s cubic-bezier(.2, .8, .2, 1); -webkit-tap-highlight-color: transparent; }
  .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .seal:hover { transform: scale(1.06) rotate(-2deg); }
  .seal:focus-visible { outline: 2px solid rgba(255, 220, 170, .8); outline-offset: 6px; border-radius: 50%; }
  .seal::before { content: ""; position: absolute; inset: -22%; border-radius: 50%; border: 1px solid rgba(255, 200, 140, .5); animation: pulse 3s ease-out infinite; pointer-events: none; opacity: 0; }
  .stage.ready .seal::before { opacity: 1; }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(1.5); opacity: 0; } }
  .seal .half.l { clip-path: polygon(0 -20%, 53% -20%, 47% 17%, 56% 33%, 45% 52%, 55% 71%, 48% 86%, 53% 120%, 0 120%); }
  .seal .half.r { clip-path: polygon(100% -20%, 53% -20%, 47% 17%, 56% 33%, 45% 52%, 55% 71%, 48% 86%, 53% 120%, 100% 120%); }
  .seal .half { transition: none; }
  .stage.broken .seal { pointer-events: none; }
  .stage.broken .seal::before { display: none; }
  .stage.broken .seal .half.l { animation: halfL 1.5s cubic-bezier(.4, 0, .7, .7) forwards; }
  .stage.broken .seal .half.r { animation: halfR 1.5s cubic-bezier(.4, 0, .7, .7) forwards; }
  @keyframes halfL { 0% { transform: none; opacity: 1; } 18% { transform: translate(-7%, -4%) rotate(-5deg); opacity: 1; } 100% { transform: translate(-26%, 190%) rotate(-34deg); opacity: 0; } }
  @keyframes halfR { 0% { transform: none; opacity: 1; } 18% { transform: translate(8%, -3%) rotate(6deg); opacity: 1; } 100% { transform: translate(34%, 210%) rotate(28deg); opacity: 0; } }
  .crumb { position: absolute; left: 50%; top: 50%; width: 9%; height: 9%; margin: -4.5%; background: radial-gradient(circle at 35% 30%, #cf3a30, #6d100c); border-radius: 40% 60% 55% 45%; opacity: 0; }
  .stage.broken .crumb { animation: crumb 1.1s cubic-bezier(.2, .7, .5, 1) forwards; animation-delay: var(--d, 0s); }
  @keyframes crumb { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
  .hint { position: absolute; left: 50%; top: calc(100% + 36px); transform: translateX(-50%); white-space: nowrap; font-family: var(--hand); font-size: 24px; color: rgba(255, 226, 180, .75);
          opacity: 0; transition: opacity 1.4s ease; pointer-events: none; text-shadow: 0 0 14px rgba(255, 190, 110, .4); }
  .stage.ready .hint { opacity: 1; }
  .stage.broken .hint { opacity: 0; transition-duration: .5s; }
  @media (prefers-reduced-motion: reduce) { .warm, .seal::before { animation: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="Живая анимация из символов: глаз, Большой взрыв, галактика, Кааба"></canvas>


<div class="eyes-shade"></div>

<div class="cta-wrap" id="ctaWrap">
  <div class="cta-bloom"></div>
  <button class="cta" id="cta" type="button" aria-label="Для тебя есть послание — открыть">
    <span class="cta-body">
      <span class="cta-bg"></span>
      <svg class="ring" aria-hidden="true">
        <defs>
          <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff2d2"/><stop offset=".5" stop-color="#dcb676"/><stop offset="1" stop-color="#fff2d2"/>
          </linearGradient>
        </defs>
        <rect class="base" pathLength="1"/>
        <rect class="inner" pathLength="1"/>
      </svg>
      <i class="orn l"></i><i class="orn r"></i>
      <span class="lbl" id="ctaLbl"></span>
    </span>
  </button>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="veil"></div>

<section class="scene-letter" id="scene" aria-label="Письмо">
  <div class="warm"></div>
  <div class="stage" id="stage">
    <div class="env-back"></div>
    <div class="letter">
      <div class="pa">
        <div class="pb"><div class="pc"></div></div>
        <div class="text" id="text"></div>
      </div>
    </div>
    <div class="env-front">
      <svg viewBox="0 0 100 66" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation=".9"/></filter>
          <linearGradient id="lt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0d2" stop-opacity=".16"/><stop offset="1" stop-color="#fff0d2" stop-opacity="0"/></linearGradient>
          <linearGradient id="rt" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2a1604" stop-opacity=".16"/><stop offset="1" stop-color="#2a1604" stop-opacity="0"/></linearGradient>
          <linearGradient id="bt" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0d2" stop-opacity=".16"/><stop offset="1" stop-color="#fff0d2" stop-opacity="0"/></linearGradient>
        </defs>
        <polygon points="0,0 50,37 0,66" fill="url(#lt)"/>
        <polygon points="100,0 50,37 100,66" fill="url(#rt)"/>
        <polygon points="0,66 50,37 100,66" fill="url(#bt)"/>
        <g fill="none" stroke="#4a2b10" stroke-opacity=".32" stroke-width=".28" stroke-linejoin="round">
          <polyline points="0,0 50,37 100,0"/><polyline points="0,66 50,37 100,66"/><line x1="0" y1="0" x2="50" y2="37"/><line x1="100" y1="0" x2="50" y2="37"/>
        </g>
        <g fill="none" stroke="#fff0d2" stroke-opacity=".18" stroke-width=".22"><polyline points="0,66 50,38 100,66" transform="translate(0,.5)"/></g>
        <polygon points="0,0 100,0 50,39" fill="#2a1406" fill-opacity=".5" filter="url(#soft)" transform="translate(0,.9)"/>
      </svg>
    </div>
    <div class="flapwrap"><div class="flap"><div class="f"></div><div class="b"></div></div></div>

    <button class="seal" id="seal" type="button" aria-label="Сломать печать и открыть письмо">
      <svg class="half l" viewBox="0 0 100 100" aria-hidden="true"><use href="#seal-art"/></svg>
      <svg class="half r" viewBox="0 0 100 100" aria-hidden="true"><use href="#seal-art"/></svg>
      <i class="crumb" style="--dx:-90%;--dy:150%;--r:200deg;--d:.05s"></i><i class="crumb" style="--dx:110%;--dy:170%;--r:-160deg;--d:.08s;width:6%;height:6%"></i>
      <i class="crumb" style="--dx:-40%;--dy:210%;--r:120deg;--d:.12s;width:5%;height:5%"></i><i class="crumb" style="--dx:60%;--dy:230%;--r:-240deg;--d:.1s;width:7%;height:7%"></i>
      <i class="crumb" style="--dx:-130%;--dy:90%;--r:90deg;--d:.02s;width:4%;height:4%"></i><i class="crumb" style="--dx:140%;--dy:80%;--r:-100deg;--d:.04s;width:4%;height:4%"></i>
      <i class="crumb" style="--dx:10%;--dy:260%;--r:300deg;--d:.15s;width:5%;height:5%"></i>
    </button>
    <div class="hint">нажми на печать</div>
  </div>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="wax" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#d8473a"/><stop offset=".45" stop-color="#a3201a"/><stop offset="1" stop-color="#5e0c09"/>
    </radialGradient>
    <radialGradient id="waxrim" cx="50%" cy="50%" r="50%">
      <stop offset=".7" stop-color="#7d130f"/><stop offset="1" stop-color="#4a0908"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.4"/></filter>

    WG[2] = 1.32 * W; WG[3] = FEM.TILT + FEM.Y0 + 0.17;
    WG[4] = 0.032; WG[5] = 0.005;
  }
  render(X, Y, t, pt, zoom, o) {
    const S = this.S;
    if (S !== 1.0) { X /= S; Y /= S; }
    const W = FEM.W, Ri = FEM.RI, Rp = this.Rp, gx = this.gx, gy = this.gy, op = this.op, opl = this.opl, aa = this.aa;
    const iris0 = Ri + 0.012, iris1 = Ri - 0.012, pup0 = Rp + 0.006, pup1 = Rp - 0.006, ks = Ri / 0.40, tdrift = this.tdrift;
    const NL = this.lashN, PX = this.lashPX, PY = this.lashPY, PR = this.lashR, BB = this.lashBox, ALL = this.lashAll, WG = this.wing;
    const x = X, y = Y;
    let u = x / W; u = u < -1.6 ? -1.6 : u > 1.6 ? 1.6 : u;

    const au = u < 0 ? -u : u;

    const uo = FS.uo, lo = FS.lo, cl = FS.cl;
    const upper = cl + (uo - cl) * op, lower = cl + (lo - cl) * opl;
    const du = upper - y, dl = y - lower;
    const inside = lid > 0 ? ss(0.0, 0.022, du) * ss(0.0, 0.022, dl) : 0.0;

    // skin
    const sk = fbm(x * 2.2, y * 2.2 + 4.0, 3, 0);
    const adu = du < 0 ? -du : du, adl = dl < 0 ? -dl : dl;
    const near = ss(0.0, 0.10, adu < adl ? adu : adl);
    const fall = Math.exp(-(x * x / 4.5 + y * y / 1.9));
    const sv = (0.70 + 0.35 * sk) * (0.62 + 0.38 * near) * fall * 0.60;
    let o0 = sv * 0.70, o1 = sv * 0.38, o2 = sv * 0.26;
    const lx = (x - 0.15) / 1.35, ly = (y - 0.36) / 0.42, mx2 = x / 1.2, my2 = (y + 0.50) / 0.25;
    const pl = (0.17 * Math.exp(-(lx * lx + ly * ly)) + 0.08 * Math.exp(-(mx2 * mx2 + my2 * my2))) * fall;
    o0 += pl * 1.0; o1 += pl * 0.70; o2 += pl * 0.50;
    const rz = (dl + 0.016) / 0.011;
    const rim = Math.exp(-(rz * rz)) * lid * op * 0.6;
    o0 += rim * 0.9; o1 += rim * 0.48; o2 += rim * 0.42;

    // eyeshadow
    const crease = uo + 0.10 + 0.06 * lid - 0.05 * (1.0 - op);
    if (y > upper - 0.02 && au < 1.35) {
      const zl = (y - upper) / Math.max(crease - upper, 0.02);
      const a = ss(1.35, 0.9, zl) * ss(1.35, 0.95, au) * ss(-0.02, 0.01, y - upper);
      if (a > 0) {
        const zz = (zl - 0.45) / 0.36, uu = (u + 0.08) / 0.65;
        const shine = Math.exp(-(zz * zz) - uu * uu);
        const lum = (0.30 + 0.92 * shine) * fall * (0.9 + 0.2 * sk);
        const smoke = ss(0.2, 1.1, u) * 0.75;
        const e0 = (1.00 + (0.46 - 1.00) * smoke) * lum, e1 = (0.58 + (0.22 - 0.58) * smoke) * lum, e2 = (0.38 + (0.12 - 0.38) * smoke) * lum;
        o0 += (e0 - o0) * a; o1 += (e1 - o1) * a; o2 += (e2 - o2) * a;
      }
    }
    const cz = (y - crease) / 0.026;
    const crs = 1.0 - Math.exp(-(cz * cz)) * lid * 0.45;

    // brow
    let dark = 0;
    const sb = (x + 1.35) / 2.85;
    if (sb > -0.08 && sb < 1.08) {
      const sc = sb < 0 ? 0 : sb > 1 ? 1 : sb;
      const yb = 0.64 + 0.22 * Math.sin(Math.PI * Math.pow(sc, 1.3)) - 0.04 * sc;
      const hz = (y - (yb - 0.15)) / 0.11;
      const hl = Math.exp(-(hz * hz)) * 0.32 * ss(-0.05, 0.25, sc) * ss(1.05, 0.7, sc) * fall;
      o0 += hl * 1.0; o1 += hl * 0.74; o2 += hl * 0.55;
      const th = 0.075 * Math.pow(1.0 - sc, 0.5) + 0.025;
      const db = y > yb ? y - yb : yb - y;
      let cov = ss(th + aa, th - aa, db) * ss(-0.08, 0.06, sb) * ss(1.08, 0.92, sb);
      if (cov > 0) {
        const ang = 1.2 - 0.95 * sc;
        const hair = 0.5 + 0.5 * Math.sin(150.0 * (y * Math.cos(ang) - x * Math.sin(ang)) + 6.0 * vnoise(x * 16.0, y * 16.0, 0));
        cov *= 0.80 + 0.20 * hair;
        const kb = cov * 0.92;
        o0 += (0.10 - o0) * kb; o1 += (0.06 - o1) * kb; o2 += (0.04 - o2) * kb;

      }
    }

    // eyeball
    if (inside > 0) {
      const dx = x - gx, dy = y - gy;
      const r = Math.sqrt(dx * dx + dy * dy) + 1e-6;
      const edge = du < dl ? du : dl;
      const ao = 0.22 + 0.78 * ss(0.0, 0.20, edge);
      const corner = 1.0 - 0.5 * ss(0.5, 1.0, au);
      const v = fbm(x * 3.3 + 3.1, y * 3.3 - 1.7, 3, 0);
      const av = v > 0.5 ? v - 0.5 : 0.5 - v;
      const vm = (1.0 - ss(0.0, 0.03, av)) * ss(0.55, 1.0, r) * 0.18;
      const aoc = ao * corner;
      let b0 = aoc * 0.72, b1 = aoc * 0.68, b2 = aoc * 0.66;
      b0 += (ao * 0.8 - b0) * vm; b1 += (ao * 0.12 - b1) * vm; b2 += (ao * 0.10 - b2) * vm;
      const kx = x - (-0.88 * W), ky = y - (FEM.TILT * -0.88 + FEM.Y0 - 0.035);
      let car = Math.exp(-(kx * kx / 0.005 + ky * ky / 0.0035));
      car = (car > 1 ? 1 : car) * 0.8;
      b0 += (0.85 - b0) * car; b1 += (0.40 - b1) * car; b2 += (0.40 - b2) * car;
      const im = ss(iris0, iris1, r);
      if (im > 0) {
        let tt = (r - Rp) / (Ri - Rp); tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
        const a = Math.atan2(dy, dx);
        const uu = (a / TAU + 0.5) * 48.0;
        const f = fbm(uu, r * 7.0 - tdrift, 3, 48);
        const f2 = fbm(uu * 0.25, r * 3.0 + 5.0, 2, 12);
        let fib = 0.22 + 1.15 * Math.pow(f, 1.6) + 0.35 * (f2 - 0.5);
        fib = fib < 0 ? 0 : fib > 2 ? 2 : fib;
        const icm = ss(0.10, 0.80, tt + 0.15 * (f2 - 0.5));
        const ic0 = 0.92 + (0.42 - 0.92) * icm, ic1 = 0.55 + (0.22 - 0.55) * icm, ic2 = 0.27 + (0.10 - 0.27) * icm;
        const cc = (tt - 0.27) / 0.07;
        const coll = 0.55 * Math.exp(-(cc * cc));
        const limbus = 1.0 - 0.9 * ss(0.74, 1.0, tt);
        const pring = ss(0.0, 0.07, tt);
        const shade = 0.35 + 0.65 * ss(0.0, 0.20, du);
        const iv = (fib + coll * f) * limbus * pring * shade * 0.75;
        b0 += (iv * ic0 - b0) * im; b1 += (iv * ic1 - b1) * im; b2 += (iv * ic2 - b2) * im;
      }
      const npm = 1.0 - ss(pup0, pup1, r);
      const sx1 = dx + 0.14 * ks, sy1 = dy - 0.14 * ks, sx2 = dx - 0.10 * ks, sy2 = dy + 0.10 * ks;
      const spec = (Math.exp(-(sx1 * sx1 + sy1 * sy1) / 0.0022) * 1.9 + Math.exp(-(sx2 * sx2 + sy2 * sy2) / 0.0006) * 0.9) * npm;
      b0 = b0 * npm + spec; b1 = b1 * npm + spec; b2 = b2 * npm + spec;
      o0 += (b0 - o0) * inside; o1 += (b1 - o1) * inside; o2 += (b2 - o2) * inside;
    }

    // eyeliner (with a wing) and lashes
    let ink = 0;
    if (lid > 0) {
      const dU = y - upper;

    }
    if (x > WG[0] - 0.05 && x < WG[2] + 0.05) {
      const dw = sdTaper(x, y, WG[0], WG[1], WG[2], WG[3], WG[4], WG[5]);
      const cw = ss(aa, -aa, dw);
      if (cw > ink) ink = cw;
    }
    if (x >= ALL[0] && x <= ALL[1] && y >= ALL[2] && y <= ALL[3]) {
      let dmin = 1e9;
      for (let k = 0; k < NL; k++) {
        const b = 4 * k;
        if (x < BB[b] || x > BB[b + 1] || y < BB[b + 2] || y > BB[b + 3]) continue;
        for (let s = 0; s < 3; s++) {
          const p = b + s;
          const d = sdTaper(x, y, PX[p], PY[p], PX[p + 1], PY[p + 1], PR[p], PR[p + 1]);

      if (cl2 > ink) ink = cl2;
    }
    if (ink > 0) {
      const k = ink * 0.96;
      o0 += (0.03 - o0) * k; o1 += (0.02 - o1) * k; o2 += (0.015 - o2) * k;
    }
    o[0] = o0; o[1] = o1; o[2] = o2; o[3] = 0; o[4] = ink > dark ? ink : dark;
  }
}

class BigBang extends World {
  constructor() { super(); this.name = "Большой взрыв"; this.dur = 8; this.hold = 1; this.roll = 0.6; this.peek = 0.55; }
  portal() { return [0, 0, 0.05]; }
  prep(t, pt) {
    const p = Math.max(pt, 0);
    this.p = p; this.speed = 0.6 + 2.6 * p; this.dist = 0.6 * pt + 1.3 * p * p;
    this.len = Math.min(0.48, 0.04 + this.speed * 0.05);
    this.heat = exp(-Math.max(pt + 0.3, 0) * 1.6);
  }
  render(X, Y, t, pt, zoom, o) {
    const r = hypot(X, Y) + 1e-4, a = atan2(Y, X);
    const dist = this.dist, length = this.len;
    let R = 0, G = 0, B = 0;
    const L = BigBang.L;
    for (let li = 0; li < 3; li++) {
      const [N, K, seed, cr, cg, cb] = L[li];
      const u = (a / TAU + 0.5) * N + seed * 0.37;
      const v = K / r + dist * 1.5;
      const cu = mod(floor(u), N), cv = floor(v);
      const h = hash(cu + seed * 7919, cv);
      if (h <= 0.80) continue;
      const h2 = hash(cu + 31, cv + seed * 104729);
      const fu = (u - floor(u)) - (0.3 + 0.4 * h2);
      const fv = (v - floor(v)) - 0.5;
      const arc = fu * TAU * r / N;
      const radial = clamp01(1 - Math.abs(fv) / length);
      const star = exp(-((arc / 0.010) ** 2)) * radial * ss(0.03, 0.35, r) * (0.5 + 0.9 * h2) * 1.4;
      R += star * cr; G += star * cg; B += star * cb;
    }
    const nu = (a / TAU + 0.5) * 10;
    const neb = fbm(nu, 2 / (r + 0.08) + dist * 2, 3, 10);
    const plasma = ss(0.55, 0.95, neb) * ss(0.05, 0.6, r) * (0.10 + 0.07 * Math.min(this.p, 3));
    const p2 = plasma * plasma * 0.8;
    R += plasma * 0.55 + p2 * 0.2; G += plasma * 0.25 + p2 * 0.6; B += plasma * 0.85 + p2 * 1.0;
    const flash = exp(-r / (0.12 + 1.0 * this.heat)) * (0.25 + 1.3 * this.heat);
    o[0] = R + flash; o[1] = G + flash * 0.92; o[2] = B + flash * 0.8; o[3] = 0;
  }
}
BigBang.L = [[90, 1.0, 1, 0.7, 0.85, 1.0], [150, 1.6, 2, 1.0, 0.75, 0.95], [240, 2.4, 3, 0.85, 1.0, 1.0]];

class Galaxy extends World {
  constructor() { super(); this.name = "Галактика"; this.dur = 10; this.hold = 3; this.roll = -0.5; this.fade = [0.2, 0.85]; this.c = cos(0.45); this.s = sin(0.45); }
  portal() { return [0, 0, 0.035]; }
  render(X, Y, t, pt, zoom, o) {
    const xr = X * this.c - Y * this.s, yr = (X * this.s + Y * this.c) / 0.58;
    const r = hypot(xr, yr) + 1e-4, a = atan2(yr, xr);
    const th = a + t * 0.10, ts = a + t * 0.25 / (r + 0.35);
    const xx = r * cos(ts), yy = r * sin(ts);
    const spiral = th - 2.3 * log(r);
    const arm = Math.pow(0.5 + 0.5 * cos(2 * spiral), 3);
    const n = fbm(xx * 4, yy * 4, 4);
    const dust = Math.pow(0.5 + 0.5 * cos(2 * spiral - 0.55), 8) * ss(0.06, 0.3, r);
    const disk = exp(-r / 0.45);
    const dens = disk * (0.18 + 1.25 * arm * (0.35 + 0.95 * n)) * (1 - 0.65 * dust * n) * 1.5;
    const bulge = exp(-((r / 0.13) ** 2)) * 1.1 + exp(-r / 0.02) * 0.9;
    const knots = ss(0.80, 0.95, vnoise(xx * 26, yy * 26)) * arm * disk * 2.5;
    const halo = exp(-hypot(X, Y) / 0.9) * 0.08;
    o[0] = dens * 0.45 + bulge * 1.0 + knots * 1.0 + halo * 0.5;
    o[1] = dens * 0.62 + bulge * 0.82 + knots * 0.32 + halo * 0.4;
    o[2] = dens * 1.0 + bulge * 0.52 + knots * 0.62 + halo * 0.9;
    o[3] = 1;
  }
}

class Kaaba extends World {
  constructor(img) {
    super();
    this.name = "Кааба"; this.dur = 16; this.hold = 8.5; this.pullback = true; this.roll = -0.25; this.fade = [0.72, 1.0];
    this.img = img; this.W = this.H = 1; this.fit(1.8, 1.0);
    this.q = 0;
  }
  fit(xmax, ymax) {
    const aspect = this.img.w / this.img.h;
    this.H = Math.max(2 * ymax, 2 * xmax / aspect); this.W = this.H * aspect;
  }
  portal() { return [-0.103 * 1.5, -0.224 * 1.5, 0.05 * 1.5]; }
  prep(t, pt) { this.q = ss(0.3, 6.5, pt); }
  render(X, Y, t, pt, zoom, o) {
    const q = this.q;
    const r = hypot(X, Y * 1.4) / 1.2;
    const delay = 0.5 * vnoise(X * 10 + 2, Y * 10) + 0.5 * clamp01(r);
    const lq = ss(0, 1, clamp01((q * 1.55 - delay) / 0.55));
    const away = (1 - lq) * (1 - lq);
    const Xs = X + away * (vnoise(X * 4 + 5, Y * 4 + t * 0.2) - 0.5) * 1.8;
    const Ys = Y + away * (vnoise(X * 4, Y * 4 - 3 + t * 0.2) - 0.5) * 1.8;
    // bilinear sample
    const im = this.img, cols = im.w, rows = im.h, d = im.data;
    const ZM = 1.6, u = Xs / this.W / ZM + 0.5, v = 0.57 - Ys / this.H / ZM;   // a little closer, centred on the Kaaba
    const fx = clamp01(u) * (cols - 1), fy = clamp01(v) * (rows - 1);
    const x0 = Math.min(floor(fx), cols - 2), y0 = Math.min(floor(fy), rows - 2);
    const tx = fx - x0, ty = fy - y0;
    const i00 = (y0 * cols + x0) * 4, i01 = i00 + 4, i10 = i00 + cols * 4, i11 = i10 + 4;
    const w00 = (1 - tx) * (1 - ty), w01 = tx * (1 - ty), w10 = (1 - tx) * ty, w11 = tx * ty;
    const edge = Math.min(Math.min(u, 1 - u) * this.W, Math.min(v, 1 - v) * this.H);
    // soft elliptical fade: the photo dissolves into the dark of the scene, no edge or frame is ever visible
    const nu = (u - 0.5) * 2, nv = (v - 0.5) * 2, rr = hypot(X * 0.55, Y * 0.95);      // screen-space falloff: the picture melts into the dark at the borders of the view
    const foot = ss(0, 0.02, edge) * (1 - ss(0.78, 1.30, rr));
    const flick = 0.55 + 0.45 * vnoise(X * 60, Y * 60 + t * 9);
    const a = foot * ss(0, 0.45, lq) * (1 - (1 - flick) * away);
    // the photo is very bright: a gentle gamma keeps the dark Kaaba readable against the white plaza
    const g = 1.9, k = a;
    o[0] = Math.pow((d[i00] * w00 + d[i01] * w01 + d[i10] * w10 + d[i11] * w11) / 255, g) * k;
    o[1] = Math.pow((d[i00 + 1] * w00 + d[i01 + 1] * w01 + d[i10 + 1] * w10 + d[i11 + 1] * w11) / 255, g) * k;
    o[2] = Math.pow((d[i00 + 2] * w00 + d[i01 + 2] * w01 + d[i10 + 2] * w10 + d[i11 + 2] * w11) / 255, g) * k;
    o[3] = 1 - a;
  }
}

/* backdrop starfield (screen space) */
const SF = [[120, 8.0, 0.22, 1], [220, 14.0, 0.45, 5]];
function starfield(X, Y, logz, t, o) {
  const r = hypot(X, Y) + 1e-5, a = atan2(Y, X);
  const lr = log(r);
  let R = 0, G = 0, B = 0;
  for (let i = 0; i < 2; i++) {
    const [N, K, par, seed] = SF[i];
    const u = (a / TAU + 0.5) * N;
    const v = (lr - par * logz) * K;
    const cu = mod(floor(u), N), cv = floor(v);
    const p = clamp(26 * TAU * r * r / (N * K), 0, 0.9);
    const h = hash(cu + seed * 1013, cv);
    if (h >= p) continue;
    const h2 = hash(cu + 77, cv + seed * 389);
    const arc = ((u - floor(u)) - (0.25 + 0.5 * h2)) * TAU * r / N;
    const rad = ((v - floor(v)) - 0.5) * r / K;
    const tw = 0.65 + 0.35 * sin(t * (1.5 + 4 * h2) + h2 * 60);
    const b = exp(-(arc * arc + rad * rad) / 0.00022) * (0.35 + 0.9 * h2) * tw;
    R += b * (0.65 + (1.0 - 0.65) * h2); G += b * (0.78 + (0.85 - 0.78) * h2); B += b * (1.0 + (0.7 - 1.0) * h2);
  }
  o[0] = R; o[1] = G; o[2] = B;
}

/* ───────── engine ───────── */
const PALETTES = ["COSMIC", "MATRIX", "AMBER", "INFERNO", "PRISM"];
const RAMP = " .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";

class Engine {
  constructor(img) {
    this.eye = new Eye();
    this.kaaba = img ? new Kaaba(img) : null;
    this.worlds = [this.eye, new BigBang(), new Galaxy()];
    if (this.kaaba) this.worlds.push(this.kaaba);
    this.cur = 0; this.pt = -0.9; this.t = 0; this.logz_total = 0; this.glitch = 0; this.palette = 0;
    this.o1 = new Float64Array(5); this.o2 = new Float64Array(5); this.o3 = new Float64Array(3);
    this.seed = 12345;
  }
  rnd() { this.seed = (Math.imul(this.seed, 1664525) + 1013904223) | 0; return (this.seed >>> 8) / 16777216; }
  setGrid(cols, rows, cw, ch) {
    this.cols = cols; this.rows = rows;
    const N = cols * rows;
    const aspect = (cols * cw) / (rows * ch);
    const fit = Math.max(1, 1.45 / aspect);
    this.X = new Float32Array(N); this.Y = new Float32Array(N);
    this.vig = new Float32Array(N);
    let mx = 0, my = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const xs = ((i + 0.5) - cols / 2) * cw / (rows * ch / 2);
      const ys = -((j + 0.5) - rows / 2) / (rows / 2);
      const k = j * cols + i;
      this.X[k] = xs * fit; this.Y[k] = ys * fit;
      mx = Math.max(mx, Math.abs(xs * fit)); my = Math.max(my, Math.abs(ys * fit));
    }
    const xmaxRaw = ((cols - 0.5) / 2) * cw / (rows * ch / 2);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const xs = ((i + 0.5) - cols / 2) * cw / (rows * ch / 2);
      const ys = -((j + 0.5) - rows / 2) / (rows / 2);
      const vx = xs / xmaxRaw;
      this.vig[j * cols + i] = clamp(1 - 0.55 * (vx * vx * 0.6 + ys * ys * 0.5), 0.25, 1);
    }
    for (const w of this.worlds) if (w.fit) w.fit(mx, my);
    this.RHO = hypot(aspect * fit, fit) * 1.06;
    this.col = new Float32Array(N * 3); this.sm = new Float32Array(N); this.ink = new Float32Array(N);
    this.eye.stepX = cw / (rows * ch / 2) * fit; this.eye.stepY = 2 / rows * fit;
    this.eye.S = 1.0 + 0.15 * ss(1.45, 1.0, aspect);   // tall screens: the eye a bit closer
  }
  advance(dt) {
    this.t += dt; this.glitch = Math.max(0, this.glitch - dt);
    if (this.final) { this.pt = Math.min(this.pt + dt, 4.8); return; }   // the story has ended on the eye: it stays open and alive
    this.pt += dt;
    if (this.pt >= this.worlds[this.cur].dur) this.switchWorld();
  }
  skip() { if (this.final) return; this.pt = this.worlds[this.cur].dur; this.switchWorld(); }
  jump(i) { if (this.final) return; this.cur = i; this.pt = i === 0 ? -0.9 : 0; this.glitch = 0.35; }
  switchWorld() {
    const w = this.worlds[this.cur];

function buildAtlas(fontPx) {
  const font = 'bold ' + fontPx + 'px "DejaVu Sans Mono", Consolas, Menlo, "Liberation Mono", "Courier New", monospace';
  const m = document.createElement("canvas").getContext("2d");
  m.font = font;
  const cw = Math.max(3, Math.ceil(m.measureText("M").width));
  const ch = Math.max(6, Math.ceil(fontPx * 1.17));
  const n = RAMP.length;
  const cv = document.createElement("canvas"); cv.width = cw * n; cv.height = ch;
  const g = cv.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#000"; g.fillRect(0, 0, cv.width, ch);
  g.font = font; g.textBaseline = "middle"; g.textAlign = "center"; g.fillStyle = "#fff";
  for (let i = 0; i < n; i++) g.fillText(RAMP[i], i * cw + cw / 2, ch / 2 + 1);
  const px = g.getImageData(0, 0, cv.width, ch).data;
  const cov = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let sum = 0;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) sum += px[(y * cv.width + i * cw + x) * 4];
    cov[i] = sum / (cw * ch);
  }
  const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => cov[a] - cov[b] || a - b);
  const sorted = document.createElement("canvas"); sorted.width = cw * n; sorted.height = ch;
  const sg = sorted.getContext("2d");
  order.forEach((src, dst) => sg.drawImage(cv, src * cw, 0, cw, ch, dst * cw, 0, cw, ch));
  const c0 = cov[order[0]], c1 = cov[order[n - 1]];

  for (let i = 0; i < n - 1; i++) levels[i] = ((cov[order[i]] - c0) / (c1 - c0) + (cov[order[i + 1]] - c0) / (c1 - c0)) / 2;
  levels[n - 1] = 2;
  return { sheet: sorted, cw, ch, levels };
}

function loadImage(src) {

    for (let i = PS.length - 1; i >= 0; i--) {
      const p = PS[i];
      let a = 0, size = p.size;
      if (p.k === "go") {
        const u = (now - p.t0) / p.dur;
        if (u < 0) continue;
        if (u < 1) {
          const e = easeOut(u), sw = Math.sin(Math.PI * u) * p.sw;
          p.x = p.sx + (p.tx - p.sx) * e - (p.ty - p.sy) * 0.0 + sw * 0.6; p.y = p.sy + (p.ty - p.sy) * e + sw * 0.4;
          a = Math.min(1, u * 4) * 0.85; size *= 0.6 + 0.4 * e;
        } else {
          const f = (u - 1) / 0.9;                       // arrival: a soft flash, then it dissolves into the line
          if (f > 1) { if (Math.random() < 0.16) PS.push({ k: "ember", s: p.s, sp: (Math.random() < 0.5 ? -1 : 1) * (0.004 + Math.random() * 0.008), off: 2 + Math.random() * 6, size: 4 + Math.random() * 6, ph: Math.random() * TAU, t0: now, x: p.tx, y: p.ty, a: 0, life: 9000 + Math.random() * 6000 }); PS.splice(i, 1); continue; }
          p.x = p.tx; p.y = p.ty; a = (1 - f) * 1.0; size *= 1 + 0.9 * Math.sin(Math.PI * Math.min(f * 1.2, 1));
        }
      } else if (p.k === "ember") {
        if (!btnRect) { PS.splice(i, 1); continue; }
        p.s += p.sp * dt;
        const [x, y] = perim(btnRect, p.s), cx = btnRect.x + btnRect.w / 2, cy = btnRect.y + btnRect.h / 2;
        let nx = x - cx, ny = y - cy; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
        const o = p.off * (0.6 + 0.4 * Math.sin(now / 1500 + p.ph));
        p.x = x + nx * o; p.y = y + ny * o - Math.sin(now / 2300 + p.ph) * 2;
        const age = (now - p.t0), fade = p.life ? Math.min(age / 1000, 1, (p.life - age) / 1500) : Math.min(age / 1800, 1);
        if (fade <= 0) { PS.splice(i, 1); continue; }
        a = (0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now / 420 + p.ph * 3))) * fade * (body.classList.contains("s-leaving") ? 0 : 1);
      } else {                                           // free
        const u = (now - p.t0) / p.dur;
        if (u >= 1) { PS.splice(i, 1); continue; }
        const dr = p.soft ? 1 : Math.pow(0.04, dt);
        p.vx *= dr; p.vy *= dr; if (!p.soft) p.vy += 90 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        a = (1 - u) * (1 - u) * (p.soft ? 0.7 : 1);
      }
      if (a <= 0.01) continue;
      fg.globalAlpha = a > 1 ? 1 : a;
      fg.drawImage(sprite, p.x - size, p.y - size, size * 2, size * 2);
    }
    fg.globalAlpha = 1;
    fxDirty = PS.length > 0;
    if (!fxDirty) fg.clearRect(0, 0, innerWidth, innerHeight);
  }
  let fxDirty = false;

  /* ── page 2: the eyes + the button ── */
  const wrap = $("ctaWrap"), cta = $("cta");
  (function label() {
    const txt = "Для тебя есть послание", box = $("ctaLbl");
    [...txt].forEach((ch, i) => { const s = document.createElement("i"); s.style.setProperty("--n", i); s.textContent = ch === " " ? " " : ch; box.appendChild(s); });
  })();
  cta.addEventListener("pointermove", e => {
    const r = cta.getBoundingClientRect();
    cta.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%"); cta.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
    ptrX = e.clientX; ptrY = e.clientY;
  });
  cta.addEventListener("pointerenter", () => { ptrIn = true; });
  cta.addEventListener("pointerleave", () => { ptrIn = false; });

  const story = { state: "intro" };
  window.story = story;
  story.eyes = async function (fast) {
    if (story.state !== "intro") return;
    story.state = "eyes";
    body.classList.add("s-eyes");
    await sleep(fast ? 250 : 3300);                       // a pause: just the eyes
    if (story.state !== "eyes") return;
    wrap.classList.add("on");
    gather(performance.now());
    await sleep(900);  wrap.classList.add("drawing");
    await sleep(1100); wrap.classList.add("texted");
    await sleep(300);  wrap.classList.add("filled");
    await sleep(900);  wrap.classList.add("live"); embers(performance.now());
  };
  eng.onFinal = () => story.eyes(false);

  cta.addEventListener("click", e => {
    if (story.state !== "eyes") return;
    story.state = "leaving";
    const now = performance.now();
    measureBtn();
    burst(e.clientX || btnRect.x + btnRect.w / 2, e.clientY || btnRect.y + btnRect.h / 2, now);
    wrap.classList.add("leaving"); body.classList.add("s-leaving");
    setTimeout(showLetter, 2100);
  });

  /* ── page 3: the letter ── */
  const stage = $("stage"), scene = $("scene"), textEl = $("text"), seal = $("seal");
  const PARAS = [
    ["hi", "Ассаляму алейкум!"],
    ["", "С возвращением тебя. Умра мубарак! Пусть Аллах примет твое паломничество, ответит на все благие дуа и наполнит твою жизнь светом и благополучием."],
    ["", "Желаю, чтобы те прекрасные чувства, которые ты испытала в священных местах, остались с тобой надолго. Хорошего и легкого отдыха после поездки!"]
  ];
  (function buildText() {
    let n = 0;
    PARAS.forEach(([cls, t]) => {
      const p = document.createElement("p"); if (cls) p.className = cls;
      t.split(" ").forEach((w, i, arr) => {
        const s = document.createElement("span"); s.className = "w"; s.style.setProperty("--i", n++); s.textContent = w; p.appendChild(s);
        if (i < arr.length - 1) p.appendChild(document.createTextNode(" "));
      });
      textEl.appendChild(p);
    });
  })();
  function fitText() {                   // shrink the type a little if a font makes the text taller than the sheet
    let f = 1; textEl.style.setProperty("--tf", f);
    textEl.style.fontSize = "calc(var(--LW) * .078 * var(--tf))";
    for (let i = 0; i < 30 && textEl.scrollHeight > textEl.clientHeight + 1 && f > 0.55; i++) { f -= 0.03; textEl.style.setProperty("--tf", f.toFixed(2)); }
  }
  function layoutLetter() {
    const EW = stage.offsetWidth, EH = stage.offsetHeight, LW = EW * 0.9, LH = LW * 1.414, PH = LH / 3;
    const k = Math.max(0.5, Math.min(0.92 * innerWidth / LW, 0.86 * innerHeight / LH, 1.3));
    const topA = EH * 0.92 - PH - EW * 0.5, centre = topA - EH / 2 + LH / 2;
    return { EW, k, tyRise: EW * 0.12, tyFinal: -centre * k };
  }
  function showLetter() {
    body.classList.add("s-letter");
    fitText();
    document.fonts && document.fonts.ready.then(fitText);
    requestAnimationFrame(() => requestAnimationFrame(() => body.classList.add("s-letter-in")));
    setTimeout(() => { stopped = true; wrap.style.display = "none"; }, 2200);
    setTimeout(() => { stage.classList.add("ready"); story.state = "letter"; }, 3600);
  }
  addEventListener("resize", () => { if (body.classList.contains("s-letter")) fitText(); });

  seal.addEventListener("click", async () => {
    if (story.state !== "letter") return;
    story.state = "opening";
    const L = layoutLetter();
    stage.classList.add("broken");                         // the wax cracks in two and falls away
    await sleep(520);
    stage.classList.add("flap-open");                      // the flap swings up and back
    await sleep(1500);
    stage.style.setProperty("--ty", L.tyRise + "px");
    stage.classList.add("rise");                           // the folded letter slides out
    await sleep(1800);
    stage.classList.add("gone");                           // the envelope sinks into the dark
    await sleep(650);
    stage.style.setProperty("--k", L.k); stage.style.setProperty("--ty", L.tyFinal + "px");
    stage.classList.add("u1");                             // first fold opens
    await sleep(1250);
    stage.classList.add("u2");                             // second fold opens
    await sleep(1700);
    fitText();
    stage.classList.add("read");                           // only now the words appear, one after another
    story.state = "read";
  });

  /* test hook: jump straight to a page */
  story.go = function (to) {
    if (to === "eyes") { eng.final = true; eng.cur = 0; eng.pt = 4.8; story.eyes(true); }
    if (to === "letter") { story.state = "eyes"; body.classList.add("s-eyes"); showLetter(); }
  };

  let last = performance.now(), acc = 0, nfr = 0, bumped = 0;
  function loop(now) {
    const rawDt = (now - last) / 1000; last = now;
    const dt = Math.min(rawDt, 0.1);
    fxStep(now, dt);
    if (stopped) { requestAnimationFrame(loop); return; }
    // gaze: mouse, or wandering when the pointer is still
    idle += dt;
    if (now - lastMove > 3500) document.body.classList.add("idle");   // hides the cursor
    let tx = (mx / Math.max(innerWidth, 1)) * 2 - 1, ty = -((my / Math.max(innerHeight, 1)) * 2 - 1);
    if (idle > 3 || (mx === 0 && my === 0)) { tx = 0.8 * sin(eng.t * 0.37) * cos(eng.t * 0.11); ty = 0.7 * sin(eng.t * 0.53 + 1); }
    const sacx = sin(eng.t * 7.1) * sin(eng.t * 2.3) * 0.03, sacy = cos(eng.t * 5.3) * 0.03;
    const kk = Math.min(1, dt * 7);
    gx += (clamp(tx, -1, 1) + sacx - gx) * kk; gy += (clamp(ty, -1, 1) + sacy - gy) * kk;
    eng.eye.gx0 = gx; eng.eye.gy0 = gy;

    if (!paused) eng.advance(dt * speed);
    const t0 = performance.now();
    eng.frame(S.atlas.levels, S.idx, S.fg, S.bl);
    const a = S.atlas, g = S.inkg, idx = S.idx, cols = eng.cols, rows = eng.rows, cw = a.cw, ch = a.ch;
    g.globalCompositeOperation = "source-over";
    g.fillStyle = "#000"; g.fillRect(0, 0, S.ink.width, S.ink.height);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const id = idx[j * cols + i];
      if (id) g.drawImage(a.sheet, id * cw, 0, cw, ch, i * cw, j * ch, cw, ch);
    }
    S.tintg.putImageData(S.tintData, 0, 0);
    g.globalCompositeOperation = "multiply"; g.imageSmoothingEnabled = false;
    g.drawImage(S.tint, 0, 0, S.ink.width, S.ink.height);
    vg.globalCompositeOperation = "source-over"; vg.fillStyle = "#000"; vg.fillRect(0, 0, S.W, S.H);
    vg.drawImage(S.ink, S.ox, S.oy);
    if (bloomOn) {
      S.bloomg.putImageData(S.bloomData, 0, 0);
      S.smallg.imageSmoothingEnabled = true; S.smallg.drawImage(S.bloomc, 0, 0, S.small.width, S.small.height);
      vg.globalCompositeOperation = "lighter"; vg.imageSmoothingEnabled = true;
      vg.drawImage(S.small, S.ox, S.oy, S.ink.width, S.ink.height);
    }
    // adaptive detail: if the machine is slow, use bigger glyphs
    acc += performance.now() - t0; nfr++;
    if (nfr >= 45) { if (acc / nfr > 26 && bumped < 6 && S.fontCss < 18) { bumped++; resize(1); } acc = 0; nfr = 0; }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
